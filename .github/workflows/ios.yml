name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild \
            -project Remoter.xcodeproj \
            -scheme Remoter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Remoter.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr Remoter-unsigned.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remoter-unsigned-IPA
          path: build/Remoter-unsigned.ipa
          if-no-files-found: error
          retention-days: 14