name: Remoter
options:
  bundleIdPrefix: com.tiernan
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Remoter:
    type: application
    platform: iOS
    sources:
      - path: Remoter
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiernan.remoter
        PRODUCT_NAME: Remoter
        INFOPLIST_FILE: Remoter/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
    scheme:
      testTargets: []
